<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forskningsagent - Fjärrkontroll</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      margin-top: 15px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #ffffff;
    }
    p.subtitle {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
    }
    input[type="email"], textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    input[type="email"]:focus, textarea:focus {
      border-color: #e67e22;
    }
    textarea {
      height: 140px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 16px;
      margin-top: 5px;
      background: #e67e22;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:active {
      background: #d35400;
    }
    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      padding: 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
    }
    .success {
      background: #1b4332;
      color: #d8f3dc;
      border: 1px solid #2d6a4f;
    }
    .error {
      background: #491217;
      color: #ff8fa3;
      border: 1px solid #5c1d24;
    }
    .loading {
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #444;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #2d6a4f;
      border-radius: 4px;
      margin-top: 15px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #52b788;
      transition: width 1s linear;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔬 Forskningsagent</h1>
    <p class="subtitle">Skicka in en frågeställning till molnet och stäng sidan.</p>

    <label for="epost">Skicka resultat till e-post:</label>
    <input type="email" id="epost" placeholder="din.adress@gmail.com" required>

    <label for="fraga">Forskningsfråga:</label>
    <textarea id="fraga" placeholder="Skriv din forskningsfråga här..."></textarea>
    
    <button id="skickaKnapp" onclick="skickaTillMolnet()">Starta bakgrundsforskning</button>

    <div id="status"></div>
  </div>

  <script>
    const ENDPOINT = "https://forsknings-agent-740210746972.europe-north1.run.app";
    let timerIntervall = null;

    window.addEventListener("DOMContentLoaded", () => {
      const sparadEpost = localStorage.getItem("forskar_epost");
      if (sparadEpost) {
        document.getElementById("epost").value = sparadEpost;
      }
    });

    function startaNedrakning(sekunder) {
      clearInterval(timerIntervall);
      let kvar = sekunder;
      const totalt = sekunder;
      const timerText = document.getElementById("timer-text");
      const progressFill = document.getElementById("progress-fill");

      timerIntervall = setInterval(() => {
        kvar--;
        const procent = Math.min(100, Math.round(((totalt - kvar) / totalt) * 100));
        
        if (progressFill) {
          progressFill.style.width = procent + "%";
        }

        if (timerText) {
          const minuter = Math.floor(kvar / 60);
          const sek = kvar % 60;
          const visning = `${minuter}:${sek < 10 ? '0' : ''}${sek}`;
          timerText.innerText = kvar > 0 ? visning : "Mejlet skickas nu...";
        }

        if (kvar <= 0) {
          clearInterval(timerIntervall);
        }
      }, 1000);
    }

    async function skickaTillMolnet() {
      const epostFalt = document.getElementById("epost");
      const textFalt = document.getElementById("fraga");
      const statusRuta = document.getElementById("status");
      const knapp = document.getElementById("skickaKnapp");

      const epost = epostFalt.value.trim();
      const fraga = textFalt.value.trim();

      if (!epost || !epost.includes("@")) {
        alert("Ange en giltig e-postadress!");
        return;
      }

      if (!fraga) {
        alert("Skriv in en frågeställning först!");
        return;
      }

      localStorage.setItem("forskar_epost", epost);

      knapp.disabled = true;
      statusRuta.className = "loading";
      statusRuta.style.display = "block";
      statusRuta.innerText = "Kontaktar Google Cloud...";

      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            fraga: fraga,
            epost: epost 
          })
        });

        if (!res.ok) {
          throw new Error("HTTP-fel: " + res.status);
        }

        statusRuta.className = "success";
        statusRuta.innerHTML = `
          ✅ <strong>Uppdrag mottaget!</strong><br>
          Agenten forskar i bakgrunden och mejlar rapporten till <strong>${epost}</strong>.<br><br>
          ⏱ <strong>Beräknad leveranstid:</strong> ca 1,5–2 minuter (<span id="timer-text">1:45</span> kvar)<br>
          <div class="progress-bar-bg">
            <div id="progress-fill" class="progress-bar-fill"></div>
          </div>
          <br>
          <em>Du kan stänga sidan eller lägga undan mobilen – processen fortsätter oavsett.</em>
        `;
        
        textFalt.value = "";
        startaNedrakning(105);
        knapp.disabled = false;
      } catch (err) {
        statusRuta.className = "error";
        statusRuta.innerHTML = "❌ <strong>Kunde inte nå molnet:</strong><br>" + err.message;
        knapp.disabled = false;
      }
    }
  </script>

</body>
</html>
